# 生产：MySQL 8。连接信息一律走环境变量，不写进仓库
spring:
  datasource:
    url: ${JB_DB_URL:jdbc:mysql://127.0.0.1:3306/jinbang?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai}
    username: ${JB_DB_USER}
    password: ${JB_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50

jb:
  demo-data: false
  admin:
    password: ${JB_ADMIN_PASSWORD:}
  ai:
    provider: ${JB_AI_PROVIDER:openai}
  pay:
    channel: ${JB_PAY_CHANNEL:none}   # 生产禁止 mock；接入微信支付后提供 PaymentGateway 实现
  recognition:
    base-url: ${JB_RECOGNITION_URL:}

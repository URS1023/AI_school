# 本地开发：H2 内存库（MySQL 兼容模式），无需安装任何中间件即可启动
spring:
  datasource:
    url: jdbc:h2:mem:jinbang;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

jb:
  demo-data: true   # 启动时写入演示学校、账号和班级（见 README）
  auth:
    captcha-enabled: false   # 仅本地开发关闭图形验证码，生产必须开启
  admin:
    password: Admin@12345    # 仅本地开发；生产用环境变量 JB_ADMIN_PASSWORD 或看首次启动日志
  recognition:
    callback-token: dev-recognition-token

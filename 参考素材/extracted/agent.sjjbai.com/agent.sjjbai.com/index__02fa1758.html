<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 适配ios全屏，增强禁止缩放效果 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>世纪金榜</title>
    <style>
        /* 遮罩层样式 */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 环形加载动画 */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #409EFF;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 0.5s linear infinite;
        }

        /* 动画效果：旋转 */
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
      MathJax = {
        svg: {
    fontURL: "/mathjax-newcm" // 指向你复制出来的字体文件夹
  },
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
        startup: { typeset: false } // 关闭自动渲染，交给Vue控制
      }
    </script>
    <script defer src="/mathjax/tex-svg.js"></script>
    <script type="module" crossorigin src="/assets/index-ClxgKZHX.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/style-CI8WvJKz.css">
  </head>
  <body id="apboaContainer">
    <div id="app" >
      <div class="loading-overlay">
        <div class="loader"></div>
      </div>
    </div>
  </body>
